name: Nix CI

on:
  workflow_call:
    inputs:
      images:
        description: JSON array of flake package names to publish as OCI images to GHCR
        type: string
        default: '[]'
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Auth token for pushing to the shared Cachix binary cache
        required: false
  push:
    branches: [main]
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Check flake
        run: nix flake check

  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - id: set-matrix
        run: echo "matrix=$(nix run github:SeineEloquenz/ci#flake-ci-matrix)" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ${{ matrix.entry.runner }}
    needs: [flake-check, generate-matrix]
    if: ${{ needs.generate-matrix.outputs.matrix != '[]' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - uses: cachix/cachix-action@v17
        with:
          name: seineeloquenz
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' }}

      - name: Build ${{ matrix.entry.attr }}
        run: nix build .#${{ matrix.entry.attr }}

      # Publish per-arch container images; the multi-arch manifest is assembled in the manifest job.
      - name: Is this package a publishable image?
        id: gate
        if: ${{ matrix.entry.kind == 'package' && inputs.images != '' && contains(fromJson(inputs.images), matrix.entry.name) }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Load image
        if: ${{ steps.gate.outputs.publish == 'true' }}
        id: load
        run: |
          image_id=$(docker load -q -i result | sed -n 's/^Loaded image: //p')
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Compute per-arch image ref
        if: ${{ steps.gate.outputs.publish == 'true' }}
        id: meta
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          case "${{ matrix.entry.system }}" in
            x86_64-linux) arch=amd64 ;;
            aarch64-linux) arch=arm64 ;;
            *) echo "unsupported system ${{ matrix.entry.system }}"; exit 1 ;;
          esac
          echo "tag=ghcr.io/${repo}/${{ matrix.entry.name }}:sha-${GITHUB_SHA::7}-${arch}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ steps.gate.outputs.publish == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & push per-arch image
        if: ${{ steps.gate.outputs.publish == 'true' }}
        run: |
          echo "Pushing ${{ steps.meta.outputs.tag }}"
          docker tag "${{ steps.load.outputs.image_id }}" "${{ steps.meta.outputs.tag }}"
          docker push "${{ steps.meta.outputs.tag }}"

  manifest:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.images != '' && inputs.images != '[]' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: ${{ fromJson(inputs.images) }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-arch tags into multi-arch manifest
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${repo}/${{ matrix.image }}"
          short=${GITHUB_SHA::7}
          sources="${image}:sha-${short}-amd64 ${image}:sha-${short}-arm64"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
            finals="${image}:${version} ${image}:latest"
          else
            finals="${image}:latest ${image}:sha-${short}"
          fi
          for final in $finals; do
            echo "Creating manifest $final from $sources"
            docker buildx imagetools create -t "$final" $sources
          done
